version: 0.2

env:
  variables:
    DOCKER_BUILDKIT: "1"
  exported-variables:
    - IMAGE_URI
    - IMAGE_TAG

phases:
  pre_build:
    commands:
      - echo "=== Beam EWA Web (flexpay-web) - Build Started ==="
      - test -n "$AWS_DEFAULT_REGION"
      - test -n "$ECR_REGISTRY"
      - test -n "$ECR_REPO_URL"
      - test -n "$CONTAINER_NAME"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - export COMMIT_HASH=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)
      - test -n "$COMMIT_HASH"
      - export IMAGE_URI="$ECR_REPO_URL"
      - export IMAGE_TAG="sha-${COMMIT_HASH}"
      - export BUILD_TAG="build-${CODEBUILD_BUILD_NUMBER}"
      - docker pull $ECR_REPO_URL:latest || true

  build:
    commands:
      - |
        docker build \
          --cache-from $ECR_REPO_URL:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t $ECR_REPO_URL:$IMAGE_TAG \
          -t $ECR_REPO_URL:$BUILD_TAG \
          -t $ECR_REPO_URL:latest \
          -f Dockerfile \
          .

  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "0" ]; then
          echo "Build failed, skipping push"
          exit 1
        fi
      - docker push $ECR_REPO_URL:$IMAGE_TAG
      - docker push $ECR_REPO_URL:$BUILD_TAG
      - docker push $ECR_REPO_URL:latest
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$IMAGE_URI:$IMAGE_TAG" > imagedefinitions.json
      - echo "=== Build Completed - $ECR_REPO_URL:$IMAGE_TAG ==="

artifacts:
  files:
    - imagedefinitions.json
