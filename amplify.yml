version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Repo gitignores package-lock.json, so `npm ci` (requires a lockfile) fails.
        - npm install --no-audit --no-fund
        - npx prisma generate
    build:
      commands:
        - env | grep -E '^(DATABASE_URL|HEALTH_CHECK_TOKEN|CORS_ALLOWED_ORIGINS|KEYCLOAK_ISSUER|CLOUDFLARE_ACCOUNT_ID|CLOUDFLARE_R2_ACCESS_KEY_ID|CLOUDFLARE_R2_SECRET_ACCESS_KEY|CLOUDFLARE_R2_BUCKET|CLOUDFLARE_R2_PUBLIC_URL)=' >> .env.production || true
        - "echo 'HEALTH_CHECK_TOKEN=TwRYm9DHdDl3f5rbZPIea2i0f9QN6ts2VdCq9OyVdmA=' >> .env.production"
        - "echo 'CORS_ALLOWED_ORIGINS=http://localhost:*,http://127.0.0.1:*,https://www.flexpay.vn,https://admin.flexpay.vn,https://beam-staging.vercel.app,https://beam-stagging.vercel.app,https://beam-landing-ewa.vercel.app' >> .env.production"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
